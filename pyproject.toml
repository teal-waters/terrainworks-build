[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "terrainworks-build"
dynamic = ["version"]
description = "TerrainWorks compiled binaries (MakeGrids, build_derivs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dask>=2026.3.0",
    "numba>=0.65.0",
    "numpy>=2.2.6",
    "rioxarray>=0.19.0",
    "scipy>=1.15.3",
    "xarray>=2025.6.1",
]

[dependency-groups]
dev = [
    "fortran-language-server>=1.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["terrainworks_build"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "terrainworks_build/_version.py"

[tool.hatch.build.hooks.custom]
