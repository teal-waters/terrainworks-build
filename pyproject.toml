[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "terrainworks-build"
dynamic = ["version"]
description = "TerrainWorks compiled binaries"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]

[dependency-groups]
dev = [
]

[tool.hatch.build.targets.wheel]
packages = ["terrainworks_build"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "terrainworks_build/_version.py"
