name: Build Binaries

on:
  pull_request:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Intel Fortran (ifx)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.2'

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install Intel MKL
        run: conda install -c https://software.repos.intel.com/python/conda/ -c conda-forge mkl==2025.2 mkl-devel==2025.2 mkl-static==2025.2 --yes

      - name: Install makedepf90
        run: sudo apt-get install -y makedepf90

      - name: Setup env
        run: |
          CONDA_BASE=$(conda info --base)
          echo "MKLROOT=$CONDA_BASE" >> $GITHUB_ENV
          echo "CPATH=$CONDA_BASE/include/intel64/ilp64" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            bldgrds
            MakeGrids
            build_derivs

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install GNU Make
        run: choco install make --no-progress -y

      - name: Setup Intel Fortran (ifx)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.2'

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install Intel MKL
        # It's tempting to use this to also install ifx, but I could never get the path set correctly for the link
        # binary....need to remove the git-based link from path and I couldn't figure out how.
        run: conda install -c https://software.repos.intel.com/python/conda/ -c conda-forge mkl==2025.2 mkl-devel==2025.2 mkl-static==2025.2 --yes

      - name: Setup env
        shell: cmd
        run: |
          echo MKLROOT=C:\Miniconda\envs\test\Library>> %GITHUB_ENV%
          echo INCLUDE=C:\Miniconda\envs\test\Library\include\intel64\lp64;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=C:\Miniconda\envs\test\Library\lib;%LIB%>> %GITHUB_ENV%

      - name: Build
        shell: cmd
        # Use the full path to Chocolatey's native Windows make (GnuWin32) rather than
        # relying on PATH resolution, which would pick up Git's MSYS2-based make first.
        # Git's make translates /flag-style args to Windows paths (e.g. /F268435456 becomes
        # C:\Program Files\Git\F268435456), breaking ifx linker flags like /F and /link.
        run: C:\ProgramData\Chocolatey\bin\make.exe -f Makefile.win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            bldgrds.exe
            MakeGrids.exe
            build_derivs.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/bldgrds
            linux/MakeGrids
            linux/build_derivs
            windows/bldgrds.exe
            windows/MakeGrids.exe
            windows/build_derivs.exe

  build-wheels:
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build wheel
        run: uv build --wheel

      - name: Upload wheel to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  publish:
    needs: [build-wheels]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Get Azure DevOps token
        id: ado-token
        run: |
          token=$(az account get-access-token \
            --resource 499b84ac-1321-427f-aa17-267ca6975798 \
            --query accessToken -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> $GITHUB_OUTPUT

      - name: Publish to Azure Artifacts
        run: |
          uv publish \
            --publish-url https://pkgs.dev.azure.com/teal-waters/default/_packaging/python/pypi/upload/ \
            --token ${{ steps.ado-token.outputs.token }}
