name: Build Binaries

on:
  pull_request:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Setup Intel Fortran (ifx)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.2'

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install Intel MKL
        run: conda install -c https://software.repos.intel.com/python/conda/ -c conda-forge mkl==2025.2 mkl-devel==2025.2 mkl-static==2025.2 --yes

      - name: Install makedepf90
        run: sudo apt-get install -y makedepf90

      - name: Setup env
        run: |
          CONDA_BASE=$(conda info --base)
          echo "MKLROOT=$CONDA_BASE" >> $GITHUB_ENV
          echo "CPATH=$CONDA_BASE/include/intel64/ilp64" >> $GITHUB_ENV

      - name: Build
        run: make

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          path: |
            bldgrds
            MakeGrids
            build_derivs

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install GNU Make
        run: choco install make --no-progress -y

      - name: Setup Intel Fortran (ifx)
        uses: fortran-lang/setup-fortran@v1
        with:
          compiler: intel
          version: '2025.2'

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install Intel MKL
        # It's tempting to use this to also install ifx, but I could never get the path set correctly for the link
        # binary....need to remove the git-based link from path and I couldn't figure out how.
        run: conda install -c https://software.repos.intel.com/python/conda/ -c conda-forge mkl==2025.2 mkl-devel==2025.2 mkl-static==2025.2 --yes

      - name: Setup env
        shell: cmd
        run: |
          echo MKLROOT=C:\Miniconda\envs\test\Library>> %GITHUB_ENV%
          echo INCLUDE=C:\Miniconda\envs\test\Library\include\intel64\ilp64;%INCLUDE%>> %GITHUB_ENV%
          echo LIB=C:\Miniconda\envs\test\Library\lib;%LIB%>> %GITHUB_ENV%

      - name: Build
        shell: cmd
        run: make -f Makefile.win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            bldgrds.exe
            MakeGrids.exe
            build_derivs.exe

  release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux binaries
        uses: actions/download-artifact@v4
        with:
          name: linux-binaries
          path: linux

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: windows

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux/bldgrds
            linux/MakeGrids
            linux/build_derivs
            windows/bldgrds.exe
            windows/MakeGrids.exe
            windows/build_derivs.exe
