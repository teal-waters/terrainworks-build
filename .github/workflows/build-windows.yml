name: Build Windows Binaries

on:
  pull_request:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Install GNU Make
        run: choco install make --no-progress -y

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          python-version: "3.10"

      - name: Install Intel compiler & libraries (primarily lapack is needed)
        run: conda install -c https://software.repos.intel.com/python/conda/ -c conda-forge mkl==2025.2 mkl-devel==2025.2 mkl-static==2025.2 ifx_win-64==2025.2 --yes

      - name: Build
        shell: cmd
        run: |
          REM --- MKL root ---
          set MKLROOT=C:\Miniconda\envs\test\Library

          REM --- INCLUDE (needed for lapack95.mod) ---
          set INCLUDE=%MKLROOT%\include;%MKLROOT%\include\intel64\ilp64;%INCLUDE%

          REM --- LIB (for linker) ---
          set LIB=%MKLROOT%\lib;%LIB%

          REM --- PATH (MKL runtime + remove bad linker) ---
          set PATH=%MKLROOT%\bin;%PATH%
          set PATH=%PATH:C:\Program Files\Git\usr\bin;=%

          REM --- sanity check ---
          make -f Makefile.win

      - name: Get version
        id: get_version
        shell: bash
        run: |
          git fetch --all --tags
          echo "VERSION=$(git describe --tags --always)" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries-${{ steps.get_version.outputs.VERSION }}
          path: |
            bldgrds.exe
            MakeGrids.exe
            build_derivs.exe
